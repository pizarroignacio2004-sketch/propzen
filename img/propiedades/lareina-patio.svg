<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Patio con parrilla y limonero de la casa en La Reina</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7FC0EA"/><stop offset="1" stop-color="#E8F5FB"/></linearGradient>
    <linearGradient id="mount" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A39CB8"/><stop offset="1" stop-color="#C2BBCF"/></linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9ACB7E"/><stop offset="1" stop-color="#6FA95A"/></linearGradient>
    <linearGradient id="house" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF8EC"/><stop offset="1" stop-color="#F0E0C6"/></linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E8D9BE"/><stop offset="1" stop-color="#D4C09C"/></linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C98A52"/><stop offset="1" stop-color="#9C6334"/></linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFF4CC" stop-opacity=".9"/><stop offset="1" stop-color="#FFF4CC" stop-opacity="0"/></radialGradient>
    <radialGradient id="shadow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#2E3A1C" stop-opacity=".38"/><stop offset="1" stop-color="#2E3A1C" stop-opacity="0"/></radialGradient>
    <radialGradient id="vignette" cx=".5" cy=".45" r=".8"><stop offset=".62" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".22"/></radialGradient>
  </defs>

  <!-- Cielo, cordillera y cerros -->
  <rect width="800" height="380" fill="url(#sky)"/>
  <circle cx="160" cy="80" r="100" fill="url(#sun)"/>
  <path d="M0 230L80 180L140 206L220 140L300 196L380 150L440 186L520 130L600 186L680 160L800 200V300H0Z" fill="url(#mount)"/>
  <path d="M220 140L202 158L220 152L234 164L244 152ZM520 130L500 150L520 144L536 156L546 142ZM380 150L366 164L382 160L394 168Z" fill="#FFFFFF"/>
  <path d="M0 290C120 262 240 284 360 270S600 258 800 276V340H0Z" fill="#8FAE8A"/>

  <!-- Muro de la casa con puerta en arco y postigos azules -->
  <rect x="470" y="120" width="330" height="300" fill="url(#house)"/>
  <path d="M460 120H800V104H460Z" fill="#C2552F"/>
  <path d="M470 104V120M500 104V120M530 104V120M560 104V120M590 104V120M620 104V120M650 104V120M680 104V120M710 104V120M740 104V120M770 104V120" stroke="#9C4220" stroke-width="2"/>
  <path d="M540 420V260A50 50 0 0 1 640 260V420Z" fill="#185AB0"/>
  <path d="M590 216V420" stroke="#134A92" stroke-width="3"/>
  <rect x="680" y="200" width="80" height="90" fill="#E6F4FB"/>
  <rect x="664" y="196" width="18" height="98" fill="#1E6FD9"/><rect x="758" y="196" width="18" height="98" fill="#1E6FD9"/>
  <path d="M720 200V290M680 245H760" stroke="#FFFFFF" stroke-width="4"/>

  <!-- Pérgola con enredadera -->
  <path d="M60 140H460M60 168H460" stroke="url(#wood)" stroke-width="12"/>
  <path d="M100 140V420M420 140V420" stroke="#A86C38" stroke-width="12"/>
  <path d="M120 128V180M180 128V180M240 128V180M300 128V180M360 128V180" stroke="#8E5A2E" stroke-width="8"/>
  <ellipse cx="160" cy="138" rx="70" ry="22" fill="#5DAA57" opacity=".9"/><ellipse cx="300" cy="132" rx="80" ry="20" fill="#4F9A4E" opacity=".9"/><ellipse cx="400" cy="146" rx="54" ry="18" fill="#6BB062" opacity=".9"/>

  <!-- Pasto y terraza de piedra -->
  <polygon points="0,380 800,380 800,600 0,600" fill="url(#grass)"/>
  <path d="M30 420l4-10M60 450l3-9M110 500l4-10M700 470l4-10M740 520l3-9M650 560l4-10M20 560l4-10" stroke="#4E8A44" stroke-width="2" stroke-linecap="round"/>
  <polygon points="70,420 470,420 560,560 -20,560" fill="url(#stone)"/>
  <path d="M30 470H510M-5 520H540M150 420L120 470M270 420L260 470M390 420L400 470M90 470L60 520M220 470L210 520M350 470L360 520M480 470L500 520M40 520L10 560M180 520L170 560M320 520L330 560M460 520L480 560" stroke="#C2AD86" stroke-width="3"/>

  <!-- Mesa de exterior con dos sillas -->
  <ellipse cx="270" cy="520" rx="150" ry="14" fill="url(#shadow)"/>
  <path d="M190 470V520M350 470V520" stroke="#8E5A2E" stroke-width="7" stroke-linecap="round"/>
  <polygon points="180,452 360,452 380,470 160,470" fill="#D29A5E"/>
  <rect x="160" y="470" width="220" height="8" fill="#A86C38"/>
  <path d="M120 420V512M150 420V512M118 466H152M390 420V512M420 420V512M388 466H422" stroke="#1E6FD9" stroke-width="6" stroke-linecap="round"/>
  <rect x="116" y="414" width="40" height="12" rx="3" fill="#1E6FD9"/><rect x="386" y="414" width="40" height="12" rx="3" fill="#1E6FD9"/>
  <ellipse cx="240" cy="452" rx="24" ry="6" fill="#FFFFFF"/><circle cx="234" cy="446" r="6" fill="#F7D43A"/><circle cx="246" cy="444" r="6" fill="#F7D43A"/>
  <rect x="290" y="436" width="14" height="18" rx="3" fill="#FFFFFF"/>

  <!-- Parrilla de ladrillo -->
  <ellipse cx="560" cy="548" rx="80" ry="10" fill="url(#shadow)"/>
  <rect x="500" y="430" width="120" height="114" fill="#B44E2C"/>
  <path d="M500 450H620M500 470H620M500 490H620M500 510H620M500 530H620M530 430V450M590 430V450M560 450V470M530 470V490M590 470V490M560 490V510M530 510V530M590 510V530" stroke="#8E3A1E" stroke-width="2"/>
  <rect x="490" y="420" width="140" height="14" fill="#C2552F"/>
  <path d="M510 416H610" stroke="#3A3A3A" stroke-width="4"/>
  <rect x="580" y="330" width="26" height="90" fill="#B44E2C"/>
  <path d="M592 326C584 310 600 300 592 286M600 326C610 308 596 298 606 280" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Limonero -->
  <ellipse cx="720" cy="560" rx="70" ry="12" fill="url(#shadow)"/>
  <path d="M720 560V450" stroke="#7A5230" stroke-width="12"/>
  <circle cx="720" cy="410" r="62" fill="#4F9A4E"/><circle cx="690" cy="392" r="40" fill="#5DAA57"/><circle cx="754" cy="400" r="38" fill="#469147"/>
  <circle cx="700" cy="400" r="7" fill="#F7D43A"/><circle cx="740" cy="384" r="7" fill="#F7D43A"/><circle cx="752" cy="424" r="7" fill="#F7D43A"/><circle cx="690" cy="430" r="6" fill="#F7D43A"/><circle cx="724" cy="440" r="6" fill="#F7D43A"/>

  <rect width="800" height="600" fill="url(#vignette)"/>
</svg>
