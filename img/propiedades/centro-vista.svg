<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Vista a la ciudad desde el studio en Santiago Centro, al atardecer</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5B5F9E"/><stop offset=".45" stop-color="#C77DA0"/><stop offset=".75" stop-color="#F28A5B"/><stop offset="1" stop-color="#FBC58C"/></linearGradient>
    <linearGradient id="andes" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6F5A86"/><stop offset="1" stop-color="#8E6E8F"/></linearGradient>
    <linearGradient id="city" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3A3550"/><stop offset="1" stop-color="#26233A"/></linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2E2B44"/><stop offset=".6" stop-color="#4B4466"/><stop offset="1" stop-color="#2E2B44"/></linearGradient>
    <linearGradient id="sill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B9C2CC"/><stop offset="1" stop-color="#8C959E"/></linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFE3B0" stop-opacity="1"/><stop offset=".35" stop-color="#FFC27A" stop-opacity=".7"/><stop offset="1" stop-color="#FFC27A" stop-opacity="0"/></radialGradient>
    <radialGradient id="vignette" cx=".5" cy=".45" r=".78"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".35"/></radialGradient>
  </defs>

  <!-- Cielo del atardecer -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="230" cy="330" r="150" fill="url(#sun)"/>
  <circle cx="230" cy="330" r="30" fill="#FFE9C4"/>

  <!-- Cordillera con nieve teñida de rosado -->
  <path d="M0 330L90 268L150 296L240 220L320 284L400 236L470 270L560 200L640 262L720 230L800 270V400H0Z" fill="url(#andes)"/>
  <path d="M240 220L220 242L240 236L256 250L268 236ZM560 200L538 222L560 216L578 230L590 216ZM400 236L384 252L402 248L416 256Z" fill="#F7D3D6"/>

  <!-- Ciudad: cerro con árboles y torres con luces encendidas -->
  <path d="M60 420C100 380 160 372 210 390C240 400 260 420 280 420Z" fill="#2F3A33"/>
  <g fill="url(#city)">
    <rect x="0" y="380" width="60" height="220"/><rect x="290" y="360" width="70" height="240"/><rect x="370" y="390" width="50" height="210"/>
    <rect x="600" y="340" width="80" height="260"/><rect x="690" y="372" width="56" height="228"/><rect x="750" y="400" width="50" height="200"/>
    <rect x="200" y="410" width="80" height="190"/><rect x="60" y="430" width="140" height="170"/>
  </g>
  <path d="M500 600V170L516 136L532 170V600Z" fill="url(#tower)"/>
  <path d="M440 600V280H480V600ZM540 600V300H590V600Z" fill="url(#city)"/>
  <g fill="#FFD27A">
    <rect x="300" y="376" width="8" height="8"/><rect x="320" y="392" width="8" height="8"/><rect x="340" y="376" width="8" height="8"/><rect x="300" y="416" width="8" height="8"/>
    <rect x="612" y="356" width="8" height="8"/><rect x="636" y="372" width="8" height="8"/><rect x="660" y="356" width="8" height="8"/><rect x="636" y="404" width="8" height="8"/><rect x="612" y="420" width="8" height="8"/>
    <rect x="510" y="200" width="6" height="6"/><rect x="510" y="236" width="6" height="6"/><rect x="510" y="290" width="6" height="6"/><rect x="510" y="344" width="6" height="6"/>
    <rect x="450" y="300" width="7" height="7"/><rect x="466" y="330" width="7" height="7"/><rect x="552" y="320" width="7" height="7"/><rect x="570" y="350" width="7" height="7"/>
    <rect x="214" y="426" width="8" height="8"/><rect x="250" y="440" width="8" height="8"/><rect x="80" y="450" width="8" height="8"/><rect x="120" y="470" width="8" height="8"/><rect x="700" y="390" width="8" height="8"/>
  </g>

  <!-- Marco negro del ventanal, alféizar de hormigón y planta -->
  <path d="M0 0H800V600H0Z M30 30V500H770V30Z" fill="#1C1C1C" fill-rule="evenodd"/>
  <path d="M400 30V500M30 250H770" stroke="#1C1C1C" stroke-width="12"/>
  <polygon points="0,500 800,500 800,520 0,520" fill="url(#sill)"/>
  <rect x="0" y="520" width="800" height="80" fill="#6E7781"/>
  <path d="M640 500H700L694 452H646Z" fill="#121212"/>
  <path d="M670 454C650 430 640 404 648 376C662 400 670 426 670 454Z" fill="#3F8854"/>
  <path d="M670 454C680 422 698 406 714 388C714 418 696 440 670 454Z" fill="#4E9A62"/>
  <rect x="96" y="470" width="70" height="30" rx="4" fill="#F06A3B"/><rect x="104" y="458" width="56" height="12" rx="3" fill="#E8EBEE"/>

  <rect width="800" height="600" fill="url(#vignette)"/>
</svg>
