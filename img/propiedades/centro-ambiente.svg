<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Ambiente único del studio en Santiago Centro</title>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B4BBC2"/><stop offset="1" stop-color="#9AA2AA"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C3CBD3"/><stop offset="1" stop-color="#9DA6AF"/></linearGradient>
    <linearGradient id="city" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3C9A6"/><stop offset="1" stop-color="#FBE6D3"/></linearGradient>
    <linearGradient id="beam" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF1DE" stop-opacity=".5"/><stop offset="1" stop-color="#FFF1DE" stop-opacity="0"/></linearGradient>
    <linearGradient id="sofa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3A3E43"/><stop offset="1" stop-color="#25282C"/></linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".22"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
    <radialGradient id="shadow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#121417" stop-opacity=".45"/><stop offset="1" stop-color="#121417" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFD9A8" stop-opacity=".75"/><stop offset="1" stop-color="#FFD9A8" stop-opacity="0"/></radialGradient>
    <radialGradient id="vignette" cx=".5" cy=".45" r=".78"><stop offset=".58" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".3"/></radialGradient>
  </defs>

  <!-- Muro de hormigón a la vista -->
  <rect width="800" height="430" fill="url(#wall)"/>
  <path d="M0 110H800M0 220H800M0 330H800M200 0V430M400 0V430M600 0V430" stroke="#8A929A" stroke-width="2" opacity=".5"/>
  <g fill="#7F878F" opacity=".45"><circle cx="40" cy="40" r="3"/><circle cx="160" cy="40" r="3"/><circle cx="240" cy="150" r="3"/><circle cx="360" cy="150" r="3"/><circle cx="40" cy="260" r="3"/><circle cx="160" cy="260" r="3"/><circle cx="240" cy="370" r="3"/><circle cx="360" cy="370" r="3"/></g>

  <!-- Ventanal industrial con la ciudad al atardecer -->
  <rect x="440" y="56" width="320" height="320" fill="#1C1C1C"/>
  <rect x="450" y="66" width="300" height="300" fill="url(#city)"/>
  <path d="M450 250H480V200H510V250H530V170L548 150L566 170V250H600V220H630V250H660V190H700V250H750V366H450Z" fill="#7A6E78"/>
  <path d="M460 270H750V366H450Z" fill="#5E5662"/>
  <path d="M538 180H558M538 200H558M538 220H558M668 206H692M668 226H692" stroke="#FFD27A" stroke-width="3"/>
  <path d="M550 66V366M650 66V366M450 166H750M450 266H750" stroke="#1C1C1C" stroke-width="8"/>
  <polygon points="450,430 750,430 820,600 300,600" fill="url(#beam)"/>

  <!-- Piso de hormigón pulido con reflejos -->
  <polygon points="0,430 800,430 800,600 0,600" fill="url(#floor)"/>
  <rect x="0" y="430" width="800" height="170" fill="url(#shine)" opacity=".6"/>
  <path d="M0 500H800" stroke="#8C959E" stroke-width="2" opacity=".5"/>
  <rect x="0" y="424" width="800" height="6" fill="#1C1C1C"/>

  <!-- Zona de cama tras un librero de metal negro -->
  <rect x="20" y="318" width="190" height="112" rx="6" fill="#E8EBEE"/>
  <rect x="20" y="300" width="190" height="30" rx="8" fill="#F6F7F8"/>
  <rect x="34" y="286" width="60" height="26" rx="8" fill="#FFFFFF"/>
  <rect x="20" y="370" width="190" height="20" fill="#F06A3B"/>
  <path d="M218 150V430M326 150V430M218 150H326M218 210H326M218 270H326M218 330H326M218 390H326" stroke="#121212" stroke-width="6"/>
  <rect x="226" y="176" width="10" height="34" fill="#F06A3B"/><rect x="240" y="182" width="12" height="28" fill="#E9ECEF"/><rect x="256" y="172" width="9" height="38" fill="#5B636B"/>
  <rect x="290" y="236" width="26" height="34" rx="4" fill="#E9ECEF"/><path d="M300 236C294 222 300 212 308 206C312 220 308 230 300 236Z" fill="#5DAA57"/>
  <rect x="230" y="296" width="40" height="34" fill="#2E3237"/><rect x="276" y="300" width="10" height="30" fill="#F06A3B"/><rect x="290" y="306" width="12" height="24" fill="#B9C2CC"/>
  <rect x="234" y="356" width="70" height="34" rx="3" fill="#B9C2CC"/>

  <!-- Lámparas colgantes -->
  <path d="M420 0V120M540 0V90" stroke="#121212" stroke-width="2"/>
  <ellipse cx="420" cy="160" rx="70" ry="36" fill="url(#glow)"/><ellipse cx="540" cy="130" rx="60" ry="30" fill="url(#glow)"/>
  <path d="M400 120H440L452 146H388Z" fill="#121212"/><path d="M524 90H556L566 112H514Z" fill="#121212"/>

  <!-- Sofá gris carbón con cojín naranja y mesa negra -->
  <polygon points="300,480 700,480 760,580 240,580" fill="#7F878F" opacity=".55"/>
  <ellipse cx="560" cy="474" rx="210" ry="14" fill="url(#shadow)"/>
  <rect x="400" y="330" width="300" height="86" rx="16" fill="url(#sofa)"/>
  <rect x="388" y="390" width="326" height="48" rx="12" fill="#30343A"/>
  <rect x="388" y="424" width="326" height="36" rx="8" fill="#1F2226"/>
  <rect x="374" y="356" width="38" height="104" rx="14" fill="#2B2F34"/><rect x="690" y="356" width="38" height="104" rx="14" fill="#2B2F34"/>
  <rect x="424" y="348" width="70" height="54" rx="12" fill="#F06A3B" transform="rotate(-6 459 375)"/>
  <rect x="604" y="350" width="66" height="50" rx="12" fill="#B9C2CC" transform="rotate(5 637 375)"/>
  <ellipse cx="440" cy="560" rx="96" ry="12" fill="url(#shadow)"/>
  <path d="M440 520V556M410 556H470" stroke="#121212" stroke-width="5"/>
  <ellipse cx="440" cy="518" rx="76" ry="16" fill="#121212"/>
  <ellipse cx="440" cy="514" rx="76" ry="14" fill="#2B2F34"/>
  <rect x="414" y="500" width="40" height="8" rx="2" fill="#F06A3B"/>

  <!-- Monstera en macetero negro -->
  <path d="M740 470H790L784 540H746Z" fill="#121212"/>
  <path d="M764 472C740 440 726 410 736 376C752 402 762 436 764 472Z" fill="#3F8854"/>
  <path d="M764 472C776 432 796 412 812 392C812 428 792 454 764 472Z" fill="#4E9A62"/>

  <rect width="800" height="600" fill="url(#vignette)"/>
</svg>
