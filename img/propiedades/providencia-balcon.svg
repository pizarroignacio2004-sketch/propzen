<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Balcón del depa en Providencia con vista a la cordillera</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8FCBEA"/><stop offset=".7" stop-color="#D9EEF8"/><stop offset="1" stop-color="#F2F9FC"/></linearGradient>
    <linearGradient id="mount" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9EAFC6"/><stop offset="1" stop-color="#B9C6D6"/></linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D3AA72"/><stop offset="1" stop-color="#B38552"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".35"/><stop offset=".5" stop-color="#CFE9F5" stop-opacity=".18"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".3"/></linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8FA3B8"/><stop offset="1" stop-color="#B3C3D3"/></linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFF6D8" stop-opacity=".9"/><stop offset="1" stop-color="#FFF6D8" stop-opacity="0"/></radialGradient>
    <radialGradient id="shadow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#3B2A17" stop-opacity=".35"/><stop offset="1" stop-color="#3B2A17" stop-opacity="0"/></radialGradient>
    <radialGradient id="vignette" cx=".5" cy=".45" r=".8"><stop offset=".62" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".2"/></radialGradient>
  </defs>

  <!-- Cielo de mañana y cordillera nevada -->
  <rect width="800" height="420" fill="url(#sky)"/>
  <circle cx="640" cy="90" r="110" fill="url(#sun)"/>
  <path d="M0 250L70 196L118 220L190 150L250 196L320 128L392 186L450 150L520 200L590 140L660 190L730 158L800 196V320H0Z" fill="url(#mount)"/>
  <path d="M190 150L172 166L190 160L204 172L214 160ZM320 128L300 148L320 142L336 154L346 140ZM590 140L572 158L590 152L604 164L614 152ZM450 150L436 164L452 160L466 168Z" fill="#FFFFFF"/>
  <path d="M0 290C120 270 220 296 340 280S580 270 800 284V340H0Z" fill="#C4CFDB"/>

  <!-- Ciudad: torres de Providencia y árboles del parque -->
  <rect x="60" y="250" width="54" height="110" fill="#B9C7D5"/>
  <rect x="124" y="220" width="40" height="140" fill="#A9B9C9"/>
  <path d="M420 360V130L436 104L452 130V360Z" fill="url(#tower)"/>
  <path d="M436 104V360" stroke="#D3DEE8" stroke-width="2"/>
  <rect x="470" y="236" width="60" height="124" fill="#BCC9D6"/>
  <rect x="540" y="200" width="44" height="160" fill="#A5B6C7"/>
  <rect x="600" y="258" width="70" height="102" fill="#C2CEDA"/>
  <rect x="690" y="226" width="48" height="134" fill="#AEBECD"/>
  <path d="M68 262H106M68 282H106M68 302H106M132 236H156M132 256H156M132 276H156M478 250H522M478 270H522M478 290H522M548 214H576M548 234H576M548 254H576M608 272H662M608 292H662M698 240H730M698 260H730" stroke="#E4ECF3" stroke-width="3"/>
  <path d="M0 360C40 330 80 350 120 334C160 320 200 344 250 330C300 316 340 342 390 330C440 318 480 340 530 328C580 316 620 340 670 330C720 320 760 338 800 330V400H0Z" fill="#7DB08A"/>
  <path d="M0 384C60 368 120 382 180 372C240 362 300 380 360 372C420 364 480 380 540 372C600 364 680 380 800 370V420H0Z" fill="#649E74"/>

  <!-- Muro del edificio y baranda de vidrio -->
  <rect x="0" y="0" width="56" height="600" fill="#EEF2F5"/>
  <rect x="44" y="0" width="12" height="600" fill="#DCE3E9"/>
  <rect x="56" y="330" width="744" height="160" fill="url(#glass)"/>
  <path d="M56 330H800" stroke="#6F7E8A" stroke-width="6"/>
  <path d="M240 330V490M430 330V490M620 330V490" stroke="#8796A2" stroke-width="4"/>
  <path d="M90 350L150 470M480 350L520 430" stroke="#FFFFFF" stroke-opacity=".5" stroke-width="3"/>

  <!-- Piso de deck -->
  <polygon points="56,490 800,490 800,600 0,600 0,560" fill="url(#deck)"/>
  <path d="M120 490L60 600M240 490L210 600M360 490L360 600M480 490L510 600M600 490L660 600M720 490L810 600" stroke="#9B7041" stroke-opacity=".55" stroke-width="2"/>

  <!-- Dos sillas y mesa redonda -->
  <ellipse cx="420" cy="584" rx="230" ry="16" fill="url(#shadow)"/>
  <g fill="none" stroke="#1D4E63" stroke-width="6" stroke-linecap="round">
    <path d="M250 430V580M310 430V580M246 500H314"/>
    <path d="M530 430V580M590 430V580M526 500H594"/>
    <path d="M420 486V580M396 580H444"/>
  </g>
  <path d="M244 420H316L322 438H238Z" fill="#1D4E63"/>
  <rect x="248" y="372" width="64" height="50" rx="8" fill="#225A72"/>
  <path d="M524 420H596L602 438H518Z" fill="#1D4E63"/>
  <rect x="528" y="372" width="64" height="50" rx="8" fill="#225A72"/>
  <ellipse cx="420" cy="486" rx="70" ry="14" fill="#E9EEF2"/>
  <ellipse cx="420" cy="482" rx="70" ry="12" fill="#FFFFFF"/>
  <path d="M394 466H414V480H394ZM428 468H446V480H428Z" fill="#00A8C8"/>
  <path d="M414 470H420C424 470 424 476 420 476H414" stroke="#00A8C8" stroke-width="2" fill="none"/>

  <!-- Maceteros -->
  <path d="M664 480H736L728 560H672Z" fill="#E7ECF0"/>
  <path d="M700 482C676 450 664 420 672 388C690 414 698 446 700 482Z" fill="#4E9A62"/>
  <path d="M700 482C712 444 732 426 748 404C748 438 728 462 700 482Z" fill="#62AE73"/>
  <path d="M700 482C694 440 698 404 712 372C722 414 714 450 700 482Z" fill="#3F8854"/>

  <rect width="800" height="600" fill="url(#vignette)"/>
</svg>
