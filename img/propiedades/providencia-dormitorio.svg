<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Dormitorio del depa en Providencia</title>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EEF2F6"/><stop offset="1" stop-color="#DCE3EA"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E2C590"/><stop offset="1" stop-color="#C99F66"/></linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#BCE1F4"/><stop offset="1" stop-color="#F3FAFE"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".55"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E6CB98"/><stop offset="1" stop-color="#CFAE76"/></linearGradient>
    <linearGradient id="duvet" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E9EEF2"/></linearGradient>
    <linearGradient id="duvetFront" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E8EDF1"/><stop offset="1" stop-color="#CDD6DE"/></linearGradient>
    <radialGradient id="shadow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#3B2A17" stop-opacity=".35"/><stop offset="1" stop-color="#3B2A17" stop-opacity="0"/></radialGradient>
    <radialGradient id="lamp" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFF1C9" stop-opacity=".8"/><stop offset="1" stop-color="#FFF1C9" stop-opacity="0"/></radialGradient>
    <radialGradient id="vignette" cx=".5" cy=".45" r=".78"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".24"/></radialGradient>
  </defs>

  <rect width="800" height="430" fill="url(#wall)"/>
  <polygon points="0,430 800,430 800,600 0,600" fill="url(#floor)"/>
  <path d="M120 430L-160 600M240 430L40 600M360 430L320 600M480 430L560 600M600 430L800 600M720 430L1040 600" stroke="#B88D57" stroke-opacity=".4" stroke-width="2"/>
  <rect x="0" y="420" width="800" height="10" fill="#FFFFFF"/>

  <!-- Ventana con cortinas livianas -->
  <rect x="34" y="70" width="170" height="300" fill="#FFFFFF"/>
  <rect x="44" y="80" width="150" height="280" fill="url(#sky)"/>
  <path d="M44 300C70 270 100 290 124 266C150 246 172 268 194 256V360H44Z" fill="#94C6A0"/>
  <path d="M119 80V360" stroke="#FFFFFF" stroke-width="6"/>
  <path d="M20 60C40 140 14 230 34 320C44 370 30 400 38 430H74C64 380 80 330 66 260C52 180 74 120 62 60Z" fill="#FFFFFF" opacity=".8"/>
  <path d="M190 60C202 130 184 210 200 290C210 350 196 400 204 430H232C224 370 236 320 226 250C214 170 230 110 222 60Z" fill="#FFFFFF" opacity=".7"/>
  <path d="M8 56H248" stroke="#C8D2DB" stroke-width="5" stroke-linecap="round"/>
  <polygon points="44,430 194,430 470,600 90,600" fill="url(#beam)"/>

  <!-- Cuadros sobre la cama -->
  <rect x="320" y="132" width="70" height="90" fill="#FFFFFF" stroke="#D0D8E0" stroke-width="2"/><rect x="330" y="142" width="50" height="70" fill="#00A8C8" opacity=".25"/><path d="M334 200C346 176 360 190 376 164" stroke="#1D4E63" stroke-width="3" fill="none"/>
  <rect x="408" y="118" width="90" height="104" fill="#FFFFFF" stroke="#D0D8E0" stroke-width="2"/><rect x="418" y="128" width="70" height="84" fill="#E9D7B3"/><circle cx="453" cy="166" r="20" fill="#1D4E63" opacity=".8"/>
  <rect x="516" y="132" width="70" height="90" fill="#FFFFFF" stroke="#D0D8E0" stroke-width="2"/><rect x="526" y="142" width="50" height="70" fill="#DCE6EE"/><path d="M530 196H572M530 184H560" stroke="#7E95A6" stroke-width="3"/>

  <!-- Cama de dos plazas -->
  <ellipse cx="455" cy="548" rx="300" ry="22" fill="url(#shadow)"/>
  <rect x="270" y="256" width="370" height="130" rx="12" fill="url(#head)"/>
  <path d="M286 270H624" stroke="#F1DDB6" stroke-width="3"/>
  <polygon points="252,370 658,370 728,486 182,486" fill="url(#duvet)"/>
  <path d="M290 400C380 392 520 402 640 396M240 440C380 430 540 444 690 436" stroke="#D9E1E8" stroke-width="3" fill="none"/>
  <rect x="182" y="486" width="546" height="56" rx="6" fill="url(#duvetFront)"/>
  <polygon points="200,456 710,456 728,486 182,486" fill="#1D4E63"/>
  <rect x="182" y="486" width="546" height="20" fill="#17404F"/>
  <path d="M214 470H690" stroke="#00A8C8" stroke-width="3" stroke-dasharray="14 10"/>
  <rect x="300" y="322" width="140" height="58" rx="18" fill="#FFFFFF" stroke="#E2E8ED" stroke-width="2"/>
  <rect x="470" y="322" width="140" height="58" rx="18" fill="#FFFFFF" stroke="#E2E8ED" stroke-width="2"/>
  <rect x="420" y="340" width="74" height="46" rx="12" fill="#00A8C8"/>
  <path d="M190 542V560M720 542V560" stroke="#B88D57" stroke-width="6" stroke-linecap="round"/>

  <!-- Velador con lámpara -->
  <ellipse cx="704" cy="470" rx="64" ry="10" fill="url(#shadow)"/>
  <rect x="660" y="372" width="90" height="94" rx="4" fill="#DDBB85"/>
  <rect x="660" y="364" width="90" height="12" rx="3" fill="#EBD3A8"/>
  <path d="M672 420H738" stroke="#C69E62" stroke-width="2"/>
  <circle cx="705" cy="440" r="4" fill="#8F6A3A"/>
  <ellipse cx="700" cy="300" rx="80" ry="60" fill="url(#lamp)"/>
  <path d="M700 364V318" stroke="#C7CFD6" stroke-width="4"/>
  <path d="M676 286H724L732 318H668Z" fill="#F6F3EC"/>
  <ellipse cx="700" cy="364" rx="16" ry="4" fill="#9AA6AF"/>

  <!-- Planta -->
  <path d="M106 470H154L148 520H112Z" fill="#E4E9ED"/>
  <path d="M130 472C112 446 100 420 108 392C122 416 130 440 130 472Z" fill="#4E9A62"/>
  <path d="M130 472C140 440 158 424 170 404C170 432 154 452 130 472Z" fill="#62AE73"/>

  <rect width="800" height="600" fill="url(#vignette)"/>
</svg>
