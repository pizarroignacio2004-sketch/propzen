<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Baño del studio en Santiago Centro</title>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C3CAD1"/><stop offset="1" stop-color="#A7AFB7"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8C959E"/><stop offset="1" stop-color="#6E7781"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".32"/><stop offset=".5" stop-color="#DDEAF2" stop-opacity=".12"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".26"/></linearGradient>
    <linearGradient id="vanity" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A2D31"/><stop offset="1" stop-color="#161719"/></linearGradient>
    <linearGradient id="towel" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E25A2C"/><stop offset=".5" stop-color="#F06A3B"/><stop offset="1" stop-color="#D9532A"/></linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5"><stop offset=".55" stop-color="#FFF1D6" stop-opacity=".9"/><stop offset="1" stop-color="#FFF1D6" stop-opacity="0"/></radialGradient>
    <radialGradient id="mirror" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#E7EDF2"/><stop offset="1" stop-color="#AEB8C2"/></radialGradient>
    <radialGradient id="shadow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#121417" stop-opacity=".45"/><stop offset="1" stop-color="#121417" stop-opacity="0"/></radialGradient>
    <radialGradient id="vignette" cx=".5" cy=".45" r=".78"><stop offset=".58" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".3"/></radialGradient>
  </defs>

  <!-- Porcelanato gris de gran formato -->
  <rect width="800" height="470" fill="url(#wall)"/>
  <path d="M0 160H800M0 320H800M200 0V470M400 0V470M600 0V470" stroke="#9AA3AC" stroke-width="2"/>
  <polygon points="0,470 800,470 800,600 0,600" fill="url(#floor)"/>
  <path d="M0 520H800M200 470L120 600M400 470L400 600M600 470L680 600" stroke="#5E6670" stroke-width="2"/>

  <!-- Mampara de vidrio y ducha negra -->
  <rect x="560" y="40" width="240" height="430" fill="#9EA7B0" opacity=".35"/>
  <path d="M700 60V120M700 120H660M654 120H690" stroke="#121212" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="672" cy="126" rx="22" ry="6" fill="#121212"/>
  <path d="M664 140L656 220M672 140L672 230M680 140L688 220" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="2" stroke-dasharray="6 10"/>
  <rect x="552" y="40" width="10" height="440" fill="#121212"/>
  <rect x="562" y="40" width="190" height="440" fill="url(#glass)"/>
  <path d="M590 70L640 200M610 60L680 240" stroke="#FFFFFF" stroke-opacity=".45" stroke-width="3"/>

  <!-- Espejo redondo con luz posterior -->
  <circle cx="300" cy="170" r="150" fill="url(#halo)"/>
  <circle cx="300" cy="170" r="104" fill="#1C1C1C"/>
  <circle cx="300" cy="170" r="98" fill="url(#mirror)"/>
  <path d="M240 110C260 96 290 92 318 100" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- Vanitorio flotante negro con cubierta de hormigón -->
  <ellipse cx="300" cy="480" rx="200" ry="12" fill="url(#shadow)"/>
  <polygon points="130,332 470,332 488,348 112,348" fill="#B9C2CC"/>
  <rect x="112" y="348" width="376" height="12" fill="#8C959E"/>
  <rect x="112" y="360" width="376" height="86" fill="url(#vanity)"/>
  <path d="M300 360V446" stroke="#3A3E43" stroke-width="2"/>
  <path d="M250 400H286M314 400H350" stroke="#8C959E" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="300" cy="330" rx="66" ry="14" fill="#F6F7F8"/>
  <path d="M234 330C234 352 366 352 366 330" fill="#E5E9EC"/>
  <path d="M300 316V280H330V292" stroke="#121212" stroke-width="6" fill="none" stroke-linecap="round"/>
  <rect x="404" y="306" width="22" height="30" rx="5" fill="#F06A3B"/><rect x="430" y="314" width="18" height="22" rx="5" fill="#E8EBEE"/>

  <!-- Toalla naranja y planta -->
  <path d="M500 220H540" stroke="#121212" stroke-width="5" stroke-linecap="round"/>
  <path d="M502 222H538V330C538 338 502 338 502 330Z" fill="url(#towel)"/>
  <path d="M502 314H538" stroke="#C4501F" stroke-width="3"/>
  <path d="M150 316H180L177 332H153Z" fill="#E8EBEE"/>
  <path d="M164 318C152 300 152 286 160 276C168 290 168 304 164 318ZM168 318C176 302 186 296 196 292C194 306 182 314 168 318Z" fill="#5DAA57"/>

  <rect width="800" height="600" fill="url(#vignette)"/>
</svg>
