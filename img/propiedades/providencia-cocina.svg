<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Cocina americana del depa en Providencia</title>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7F9FA"/><stop offset="1" stop-color="#E5EAEF"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E2C590"/><stop offset="1" stop-color="#C99F66"/></linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B8DFF3"/><stop offset="1" stop-color="#F1FAFE"/></linearGradient>
    <linearGradient id="beam" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".55"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
    <linearGradient id="lower" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#245E77"/><stop offset="1" stop-color="#17404F"/></linearGradient>
    <linearGradient id="barFront" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2F4F6"/><stop offset="1" stop-color="#D9E0E6"/></linearGradient>
    <linearGradient id="underShade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5A6B78" stop-opacity=".22"/><stop offset="1" stop-color="#5A6B78" stop-opacity="0"/></linearGradient>
    <radialGradient id="shadow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#3B2A17" stop-opacity=".35"/><stop offset="1" stop-color="#3B2A17" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFF4D2" stop-opacity=".7"/><stop offset="1" stop-color="#FFF4D2" stop-opacity="0"/></radialGradient>
    <radialGradient id="vignette" cx=".5" cy=".45" r=".78"><stop offset=".62" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".22"/></radialGradient>
  </defs>

  <rect width="800" height="470" fill="url(#wall)"/>
  <!-- Muebles altos blancos y ventana -->
  <rect x="40" y="56" width="440" height="150" rx="3" fill="#FFFFFF"/>
  <path d="M150 56V206M260 56V206M370 56V206" stroke="#E1E7EC" stroke-width="2"/>
  <path d="M138 190H146M164 190H172M248 190H256M274 190H282M358 190H366M384 190H392" stroke="#9FB2C0" stroke-width="3" stroke-linecap="round"/>
  <rect x="40" y="206" width="440" height="36" fill="url(#underShade)"/>
  <rect x="544" y="66" width="206" height="196" rx="2" fill="#FFFFFF"/>
  <rect x="556" y="78" width="182" height="172" fill="url(#sky)"/>
  <path d="M556 200C590 170 620 190 650 168C680 150 708 172 738 160V250H556Z" fill="#8FC39B"/>
  <path d="M647 78V250" stroke="#FFFFFF" stroke-width="7"/>

  <!-- Muro de azulejos claros -->
  <rect x="0" y="242" width="800" height="96" fill="#E9EFF4"/>
  <path d="M0 266H800M0 290H800M0 314H800" stroke="#D3DCE4" stroke-width="2"/>
  <path d="M40 242V266M120 242V266M200 242V266M280 242V266M360 242V266M440 242V266M520 242V266M600 242V266M680 242V266M760 242V266M80 266V290M160 266V290M240 266V290M320 266V290M400 266V290M480 266V290M560 266V290M640 266V290M720 266V290M40 290V314M120 290V314M200 290V314M280 290V314M360 290V314M440 290V314M520 290V314M600 290V314M680 290V314M760 290V314M80 314V338M160 314V338M240 314V338M320 314V338M400 314V338M480 314V338M560 314V338M640 314V338M720 314V338" stroke="#D3DCE4" stroke-width="2"/>

  <!-- Mesón blanco y muebles bajos azul petróleo -->
  <polygon points="0,332 800,332 800,348 0,348" fill="#FBFCFD"/>
  <rect x="0" y="346" width="800" height="5" fill="#D8DFE5"/>
  <rect x="0" y="351" width="800" height="119" fill="url(#lower)"/>
  <path d="M110 351V470M220 351V470M330 351V470M440 351V470M550 351V470M660 351V470" stroke="#2C6A85" stroke-width="2"/>
  <path d="M60 364H160M170 364H270M280 364H380M390 364H490M500 364H600M610 364H710" stroke="#D9E2E8" stroke-width="3" stroke-linecap="round"/>
  <!-- Encimera, llave, hervidor y plantas -->
  <rect x="96" y="326" width="132" height="7" rx="2" fill="#1B1D1F"/>
  <ellipse cx="128" cy="329" rx="14" ry="2" fill="#3A3E42"/><ellipse cx="196" cy="329" rx="14" ry="2" fill="#3A3E42"/>
  <rect x="300" y="318" width="90" height="14" rx="3" fill="#DDE3E8"/>
  <path d="M344 330V286C344 274 360 274 360 286V292" stroke="#9AA6AF" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M440 304H476L480 332H436Z" fill="#E9EEF2"/><path d="M448 304C448 292 468 292 468 304" stroke="#1D4E63" stroke-width="4" fill="none"/>
  <path d="M520 332H556L552 306H524Z" fill="#FFFFFF"/>
  <path d="M538 306C520 286 516 270 524 256C534 272 540 288 538 306Z" fill="#5FAA72"/>
  <path d="M538 306C548 280 560 270 572 262C570 284 556 298 538 306Z" fill="#4A945E"/>
  <polygon points="556,250 738,250 820,470 520,470" fill="url(#beam)" opacity=".7"/>

  <!-- Piso -->
  <polygon points="0,470 800,470 800,600 0,600" fill="url(#floor)"/>
  <path d="M100 470L-120 600M220 470L80 600M340 470L300 600M460 470L520 600M580 470L740 600M700 470L960 600" stroke="#B88D57" stroke-opacity=".4" stroke-width="2"/>

  <!-- Barra americana en primer plano con dos pisos -->
  <ellipse cx="300" cy="598" rx="300" ry="18" fill="url(#shadow)"/>
  <polygon points="40,470 560,470 600,500 0,500" fill="#FBFCFD"/>
  <rect x="0" y="500" width="600" height="100" fill="url(#barFront)"/>
  <path d="M0 500H600" stroke="#C5CFD7" stroke-width="2"/>
  <rect x="130" y="446" width="90" height="26" rx="4" fill="#F1E3C6"/>
  <ellipse cx="175" cy="446" rx="45" ry="6" fill="#E3CFA6"/>
  <circle cx="160" cy="440" r="9" fill="#F28C38"/><circle cx="182" cy="436" r="9" fill="#F5C64D"/><circle cx="196" cy="444" r="8" fill="#7DBB55"/>
  <path d="M380 470V452H404V470M372 452H412" stroke="#9AA6AF" stroke-width="3" fill="none"/>
  <rect x="384" y="436" width="16" height="16" rx="3" fill="#00A8C8"/>

  <g>
    <ellipse cx="660" cy="596" rx="60" ry="8" fill="url(#shadow)"/>
    <path d="M640 482L626 600M680 482L694 600M650 482L656 600" stroke="#1D4E63" stroke-width="5" stroke-linecap="round"/>
    <path d="M630 540H690" stroke="#1D4E63" stroke-width="4"/>
    <ellipse cx="660" cy="480" rx="38" ry="10" fill="#C99D61"/>
    <ellipse cx="660" cy="476" rx="38" ry="9" fill="#DDB87E"/>
  </g>
  <g>
    <ellipse cx="760" cy="596" rx="60" ry="8" fill="url(#shadow)"/>
    <path d="M740 482L726 600M780 482L794 600M750 482L756 600" stroke="#1D4E63" stroke-width="5" stroke-linecap="round"/>
    <path d="M730 540H790" stroke="#1D4E63" stroke-width="4"/>
    <ellipse cx="760" cy="480" rx="38" ry="10" fill="#C99D61"/>
    <ellipse cx="760" cy="476" rx="38" ry="9" fill="#DDB87E"/>
  </g>

  <!-- Lámparas colgantes -->
  <path d="M200 0V88M360 0V88" stroke="#2B2B2B" stroke-width="2"/>
  <path d="M176 88H224L216 112H184Z" fill="#00A8C8"/><path d="M336 88H384L376 112H344Z" fill="#00A8C8"/>
  <ellipse cx="200" cy="130" rx="60" ry="30" fill="url(#glow)"/><ellipse cx="360" cy="130" rx="60" ry="30" fill="url(#glow)"/>

  <rect width="800" height="600" fill="url(#vignette)"/>
</svg>
