<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Living mediterráneo de la casa en La Reina</title>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF7EA"/><stop offset="1" stop-color="#F1E1C8"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D86A43"/><stop offset="1" stop-color="#B44E2C"/></linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7FC0EA"/><stop offset="1" stop-color="#E4F3FB"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF8E6" stop-opacity=".55"/><stop offset="1" stop-color="#FFF8E6" stop-opacity="0"/></linearGradient>
    <linearGradient id="sofa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F1E3BC"/><stop offset="1" stop-color="#DCC48E"/></linearGradient>
    <linearGradient id="beamWood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A86C38"/><stop offset="1" stop-color="#7E4F27"/></linearGradient>
    <radialGradient id="shadow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#4A1E0C" stop-opacity=".4"/><stop offset="1" stop-color="#4A1E0C" stop-opacity="0"/></radialGradient>
    <radialGradient id="vignette" cx=".5" cy=".45" r=".78"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".24"/></radialGradient>
  </defs>

  <rect width="800" height="430" fill="url(#wall)"/>
  <!-- Vigas a la vista -->
  <rect x="0" y="0" width="800" height="26" fill="url(#beamWood)"/>
  <rect x="0" y="26" width="800" height="6" fill="#5E3A1C" opacity=".25"/>
  <path d="M130 0V26M330 0V26M530 0V26M730 0V26" stroke="#6B4220" stroke-width="3"/>

  <!-- Ventana en arco con jardín y limonero -->
  <path d="M290 382V176A110 110 0 0 1 510 176V382Z" fill="#FFFFFF"/>
  <path d="M304 372V180A96 96 0 0 1 496 180V372Z" fill="url(#sky)"/>
  <path d="M304 300C340 280 370 296 400 282C430 268 460 290 496 278V372H304Z" fill="#7DB36B"/>
  <circle cx="452" cy="250" r="44" fill="#4F9A4E"/><circle cx="430" cy="232" r="30" fill="#5DAA57"/>
  <circle cx="440" cy="244" r="5" fill="#F7D43A"/><circle cx="462" cy="226" r="5" fill="#F7D43A"/><circle cx="470" cy="260" r="5" fill="#F7D43A"/><circle cx="426" cy="262" r="4" fill="#F7D43A"/>
  <path d="M452 290V340" stroke="#7A5230" stroke-width="7"/>
  <path d="M400 84V372M304 236H496" stroke="#FFFFFF" stroke-width="7"/>
  <rect x="280" y="380" width="240" height="12" rx="2" fill="#FFFFFF"/>
  <polygon points="304,430 496,430 640,600 220,600" fill="url(#beam)"/>

  <!-- Piso de terracota -->
  <polygon points="0,430 800,430 800,600 0,600" fill="url(#floor)"/>
  <path d="M0 452H800M0 480H800M0 516H800M0 560H800" stroke="#F4D3BE" stroke-opacity=".45" stroke-width="2"/>
  <path d="M60 430L-200 600M160 430L-30 600M260 430L140 600M360 430L320 600M460 430L520 600M560 430L700 600M660 430L870 600M760 430L1050 600" stroke="#F4D3BE" stroke-opacity=".45" stroke-width="2"/>
  <rect x="0" y="422" width="800" height="8" fill="#E9D2B0"/>
  <polygon points="304,430 496,430 640,600 220,600" fill="url(#beam)"/>

  <!-- Olivo en macetero de greda -->
  <ellipse cx="150" cy="470" rx="70" ry="10" fill="url(#shadow)"/>
  <path d="M110 380H190L178 466H122Z" fill="#C2552F"/><path d="M106 372H194V390H106Z" fill="#D2653C"/>
  <path d="M150 376C146 330 160 300 150 262" stroke="#6E4A2A" stroke-width="6" fill="none"/>
  <ellipse cx="128" cy="250" rx="46" ry="26" fill="#8EA36A"/><ellipse cx="176" cy="226" rx="44" ry="26" fill="#9CB277"/><ellipse cx="150" cy="198" rx="40" ry="24" fill="#86A063"/>

  <!-- Alfombra con trama azul -->
  <polygon points="250,486 650,486 720,590 180,590" fill="#F4EAD3"/>
  <polygon points="270,494 632,494 694,582 206,582" fill="none" stroke="#1E6FD9" stroke-width="4"/>
  <path d="M300 520H600M290 548H620" stroke="#1E6FD9" stroke-width="2" stroke-dasharray="10 12"/>

  <!-- Sofá crema con cojines azules -->
  <ellipse cx="560" cy="470" rx="230" ry="16" fill="url(#shadow)"/>
  <rect x="560" y="316" width="214" height="92" rx="20" fill="url(#sofa)"/>
  <rect x="540" y="380" width="250" height="50" rx="14" fill="#E8D5A5"/>
  <rect x="540" y="416" width="250" height="40" rx="10" fill="#CFB47C"/>
  <rect x="530" y="340" width="36" height="116" rx="16" fill="#DEC896"/>
  <rect x="582" y="334" width="66" height="56" rx="14" fill="#1E6FD9" transform="rotate(-7 615 362)"/>
  <rect x="666" y="334" width="66" height="56" rx="14" fill="#FFFFFF" transform="rotate(6 699 362)"/>
  <path d="M674 344L724 386M674 362L716 396" stroke="#1E6FD9" stroke-width="3"/>

  <!-- Mesa de centro de madera -->
  <ellipse cx="420" cy="540" rx="120" ry="14" fill="url(#shadow)"/>
  <path d="M330 506V536M510 506V536" stroke="#8E5A2E" stroke-width="8" stroke-linecap="round"/>
  <polygon points="340,488 500,488 524,508 316,508" fill="#D29A5E"/>
  <rect x="316" y="508" width="208" height="12" fill="#A86C38"/>
  <path d="M396 482C394 462 414 458 410 440C424 452 420 470 414 482Z" fill="#6FA45A"/>
  <rect x="392" y="478" width="26" height="14" rx="4" fill="#1E6FD9"/>
  <rect x="440" y="482" width="44" height="8" rx="2" fill="#F4EAD3"/>

  <rect width="800" height="600" fill="url(#vignette)"/>
</svg>
